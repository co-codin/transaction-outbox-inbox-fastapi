[tool.ruff]
target-version = "py312"
extend-exclude = [".claude", ".omx", "app/grpc/*_pb2.py", "app/grpc/*_pb2_grpc.py"]

[tool.ruff.lint]
# Ruff's built-in default. Pinned so a newer Ruff release cannot turn on the
# entire rule set against code that was written for E/F only.
select = ["E4", "E7", "E9", "F"]
